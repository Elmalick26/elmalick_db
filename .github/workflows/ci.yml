# ci.yml — تشغيل الاختبارات والـ linting عند كل push/PR على main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==24.1.1 flake8==7.0.0 isort==5.13.2 mypy==1.8.0

      - name: Check formatting with black
        run: black --check --diff .

      - name: Check import order with isort
        run: isort --check-only --diff .

      - name: Lint with flake8
        run: flake8 .

      - name: Type check services & repositories (mypy)
        run: mypy services/ repositories/
        continue-on-error: true   # type hints encore en cours d'ajout

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
